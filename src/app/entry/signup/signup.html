<div class="auth-container">
    <div class="auth-card">
      <h2>Create an Account</h2>
      <p class="subtitle">Get started by creating your account.</p>
      @if (inviteId()) {
        <p class="invite-message">You've been invited to join a family! Create an account to accept.</p>
      }
      <!-- Signup Form -->
      <form (ngSubmit)="onSignup()">
        <div class="input-group">
          <label for="name">Name</label>
          <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="John Doe" required>
        </div>
        <div class="input-group">
          <label for="email">Email</label>
          <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
        </div>
  
        <!-- Error Message Display -->
        @if (errorMessage()) {
          <p class="error-message">{{ errorMessage() }}</p>
        }
  
        <button type="submit" class="auth-button" [disabled]="isLoading() || !name() || !email() || !password()">
          {{ isLoading() ? 'Creating Account...' : 'Create Account' }}
        </button>
      </form>
  
      <div class="separator">or</div>
  
      <!-- Google Sign-In Button -->
      <button class="google-button" (click)="onGoogleSignup()" [disabled]="isLoading()">
        Sign Up with Google
      </button>
      
      <p class="footer-text">
        Already have an account? <a routerLink="/login">Log In</a>
      </p>
    </div>
  </div>
