<div class="container post-list-container">
  @for (post of (posts$ | async); track post.id) {
    <app-post-item [post]="post"></app-post-item>
  } @empty {
    <div class="empty-feed-message">
      <p class="text-xl font-bold">Welcome to the family feed!</p>
      <p class="text-muted">Be the first to share a post.</p>
    </div>
  }
</div>
