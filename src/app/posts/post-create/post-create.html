
<div class="composer-container">

  <div class="composer-header">
    <a routerLink="/" class="back-link">
      <span class="material-symbols-rounded">arrow_back</span>
      Back to Feed
    </a>
  </div>

  <div class="composer-content">
    <div class="user-info">
      <div class="avatar">
        <img
          [src]="currentUser()?.photoURL || 'https://api.dicebear.com/9.x/glass/svg?seed={{this.authService.currentUser()?.displayName}}'"
          alt="Avatar">
      </div>
      <span class="user-name">{{ currentUser()?.displayName || 'Family Member' }}</span>
    </div>

    <textarea class="composer-textarea" [(ngModel)]="content" placeholder="Share a story, a photo, or a quick hello...">
    </textarea>

    <!-- Media Previews -->
    <div class="media-preview-area">
      @if (imagePreviewUrl(); as imageUrl) {
      <div class="preview-item image-preview">
        <img [src]="imageUrl" alt="Image preview">
        <button class="remove-media-button" (click)="removeImage()" title="Remove image">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      }
      @if (audioPreviewUrl(); as audioUrl) {
      <div class="preview-item audio-preview">
        <app-audio-waveform [audioUrl]="audioUrl!" />
        <button class="remove-media-button" (click)="removeAudio()" title="Remove audio">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      }
    </div>

    <!-- Inline Tools -->
    @if (showRecordAudio()) {
    <div class="inline-tool-container">
      <app-record-audio (audioSaved)="onAudioSaved($event)" (closed)="onAudioRecorderClosed()">
      </app-record-audio>
    </div>
    }

    @if (showDoodleCanvas()) {
    <div class="inline-tool-container">
      <app-doodle-create (doodleSaved)="onDoodleSaved($event)" (closed)="onDoodleClosed()">
      </app-doodle-create>
    </div>
    }
  </div>

  <!-- Native Footer Actions -->
  <div class="composer-footer">
    <div class="action-icons">
      <label for="image-upload" class="icon-button" title="Add Photo">
        <span class="material-symbols-rounded">image</span>
      </label>
      <input id="image-upload" type="file" (change)="onImageSelected($event)" (click)="$event.target.value = ''"
        accept="image/*" hidden>

      <button (click)="toggleRecordAudio()" class="icon-button" [class.active]="showRecordAudio()" title="Record Audio">
        <span class="material-symbols-rounded">mic</span>
      </button>

      <button (click)="toggleDoodleCanvas()" class="icon-button" [class.active]="showDoodleCanvas()" title="Doodle">
        <span class="material-symbols-rounded">brush</span> <!-- Changed icon to brush for doodle -->
      </button>
    </div>

    <div class="submit-area">
      @if (errorMessage()) {
      <span class="error-message">{{ errorMessage() }}</span>
      }
      <button class="post-button" (click)="addPost()"
        [disabled]="isSubmitting() || (!content().trim() && !imagePreviewUrl() && !audioPreviewUrl())">
        {{ isSubmitting() ? 'Posting...' : 'Post' }}
      </button>
    </div>
  </div>
</div>
