<!-- 
  WIZ'S NOTES:
  This is a complete redesign of the comment section for a superior UX.
  1.  Proper Header: The title is now a proper section header with a comment count,
      which is more informative and visually appealing.
  2.  Textarea for Comments: The `<input>` has been replaced with a `<textarea>`
      set to `rows="1"`. This is the first step for creating an "auto-growing"
      input, which is a much better user experience. [1]
  3.  Avatar in Form: The user's avatar is now included in the form. This makes
      the act of commenting feel more personal and integrated.
  4.  Improved Empty State: The "no comments" message is now more visually
      engaging with an icon.
-->
<section class="comments-section">
    <div class="comments-header">
      <h3>Comments ({{ (comments$ | async)?.length || 0 }})</h3>
    </div>
  
    <div class="comments-list">
      @for (comment of comments$ | async; track comment.id) {
        <app-comment-item [comment]="comment"></app-comment-item>
      } @empty {
        <div class="empty-comments">
          <span class="material-symbols-rounded">chat_bubble_outline</span>
          <p>Be the first to share your thoughts!</p>
        </div>
      }
    </div>
  
    <div class="comment-form-area">
      <!-- The current user's avatar -->
      <div class="user-avatar">
        <img [src]="currentUser()?.photoURL || 'https://api.dicebear.com/9.x/glass/svg?seed=' + currentUser()?.displayName" alt="Your avatar">
      </div>
  
      <!-- The form itself -->
      <div class="form-controls">
        <textarea 
          class="comment-textarea"
          rows="1"
          placeholder="Add a comment..." 
          [(ngModel)]="newCommentText"
          (keyup.enter)="addComment()"
          ></textarea> <!-- Note: autoResize logic would be needed in your component's .ts file -->
        <div class="form-actions">
          <button 
            class="submit-comment-button" 
            (click)="addComment()" 
            [disabled]="!newCommentText().trim()">
            Post
          </button>
        </div>
      </div>
    </div>
  </section>
