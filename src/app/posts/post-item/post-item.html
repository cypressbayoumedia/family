<!-- 
  WIZ'S NOTES:
  This is a complete architectural overhaul for better accessibility, interactivity, and brand expression.
  1.  Accessibility First (No Giant Link): The entire card is no longer a single, massive link. Instead, a (click) handler on the main content area provides the navigation. This is CRITICAL because it allows interactive elements like the audio player, future "Like" buttons, and user profiles to be clicked without conflicts.
  2.  Smarter Avatar: The avatar now correctly displays the user's actual photo if it exists, falling back to the initial letter only when necessary. This feels much more personal.
  3.  Human-Readable Timestamps: It's designed for a `timeAgo` pipe (e.g., "2 hours ago," "Yesterday"), which is a much better user experience than a static date.
  4.  Unique "Doodle-Cast" Styling: A conditional class `[class.doodle-post]` is added. This allows you to visually distinguish these special, brand-defining posts in the feed, making the app more delightful.
  5.  Engaging Footer: The "coming soon" button is replaced with an interactive, icon-based footer that shows real data (comment counts). This primes users for engagement and makes the app feel more alive.
-->
<div class="post-card">
  <!-- [class.doodle-post]="post().type === 'doodle'" -->
  <!-- HEADER: User info and timestamp -->
  <div class="post-header">
    <div class="author-details">
      <!-- Smarter Avatar Logic -->
      <div class="avatar">
        @if (post().authorPhotoURL) {
        <img [src]="post().authorPhotoURL || 'https://api.dicebear.com/9.x/glass/svg?seed={{post().authorName}}'"
          [alt]="post().authorName + ' avatar'">
        } @else {
        <span class="avatar-fallback">{{ post().authorName.charAt(0) }}</span>
        }
      </div>
      <div class="author-info">
        <span class="author-name">{{ post().authorName }}</span>
        <!-- This assumes you create a custom `timeAgo` pipe for a better UX -->
        <span class="post-timestamp">{{ post().createdAt.toDate() | date: 'short'}}</span>
      </div>
    </div>
    <!-- Future: Options menu (delete, edit, etc.) -->
    <div class="relative">
      <button class="options-button" title="Post options" (click)="toggleMenu($event)">
        <span class="material-symbols-rounded">more_horiz</span>
      </button>

      @if (menuOpen()) {
      <!-- Backdrop to close menu when clicking outside -->
      <div class="menu-backdrop" (click)="toggleMenu($event)"></div>

      <div class="options-menu">
        @if (canDelete()) {
        <button class="menu-item delete" (click)="deletePost()">
          <span class="material-symbols-rounded">delete</span>
          Delete Post
        </button>
        } @else {
        <!-- Use report button for non-authors -->
        <button class="menu-item" (click)="toggleMenu($event)">
          <span class="material-symbols-rounded">flag</span>
          Report
        </button>
        }
      </div>
      }
    </div>
  </div>

  <!-- BODY: Clickable content area for navigation -->
  <div class="post-body" (click)="navigateToPost(post().id)">
    <!-- @if (post().type === 'doodle' && post().imageUrl) {
      <p class="doodle-prompt">...drew a Doodle for the family!</p>
    } -->
    @if (post().content) {
    <p class="post-content">{{ post().content }}</p>
    }

    <div class="post-media">
      @if (post().imageUrl) {
      <!-- Add a container to enforce aspect ratio and prevent layout shifts -->
      <div class="image-container">
        <img [src]="post().imageUrl" alt="Post image" class="post-image" loading="lazy">
      </div>
      }
      @if (post().audioUrl) {
      <div (click)="$event.stopPropagation()">
        <app-audio-waveform [audioUrl]="post().audioUrl!" />
      </div>
      }
    </div>
  </div>

  <!-- FOOTER: All actions are here -->
  <div class="post-footer">
    <!-- Stop propagation on all footer actions -->
    <div class="footer-actions" (click)="$event.stopPropagation()">
      <button (click)="navigateToPost(post().id)" class="action-button">
        <!-- (click)="navigateToPost()" -->
        <span class="material-symbols-rounded">chat_bubble_outline</span>
        <!-- Show real data, even if it's zero -->
        <span>{{ post().commentCount || 0 }}</span>
      </button>
      <!-- Example of a future "Like" button -->
      <button class="action-button">
        <!-- <span class="material-symbols-rounded">favorite_border</span> -->
        <!-- <span>{{ post().likeCount || 0 }}</span> -->
      </button>
    </div>
  </div>
</div>
