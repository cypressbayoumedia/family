<div class="doodle-container">

  <!-- The main canvas area where the user draws -->
  <div #canvasContainer class="doodle-canvas-area">
    <canvas #drawingCanvas (mousedown)="startDrawing($event)" (mousemove)="draw($event)" (mouseup)="stopDrawing()"
      (mouseleave)="stopDrawing()" (touchstart)="startDrawing($event)" (touchmove)="draw($event)"
      (touchend)="stopDrawing()"></canvas>
  </div>

  <!-- The toolbar for drawing tools and actions -->
  <div class="doodle-toolbar">

    <!-- Row 1: Tools -->
    <div class="tools-row">
      <!-- Brush & Eraser -->
      <div class="tool-group">
        <button (click)="setTool('brush')" [class.active]="activeTool() === 'brush'" class="tool-btn" title="Brush">
          <span class="material-symbols-rounded">brush</span>
        </button>
        <button (click)="setTool('eraser')" [class.active]="activeTool() === 'eraser'" class="tool-btn" title="Eraser">
          <span class="material-symbols-rounded">ink_eraser</span>
        </button>
      </div>

      <!-- Color Swatches -->
      <div class="color-group">
        <div class="color-picker-wrapper">
          <input type="color" [value]="brushColor()" (input)="updateColor($event)" />
          <div class="color-circle custom" [style.backgroundColor]="brushColor()"></div>
        </div>
        @for(color of presets; track color) {
        <button (click)="setPresetColor(color)" class="color-circle" [style.backgroundColor]="color"></button>
        }
      </div>

      <!-- Size Slider -->
      <div class="slider-group">
        <span class="material-symbols-rounded icon-small">line_weight</span>
        <input type="range" min="1" max="50" [value]="brushSize()" (input)="updateSize($event)" />
        <span class="size-label">{{ brushSize() }}px</span>
      </div>
    </div>

    <!-- Row 2: Actions -->
    <div class="actions-row">
      <button (click)="clearCanvas()" class="action-btn icon-only" title="Delete">
        <span class="material-symbols-rounded">delete</span>
      </button>

      <button (click)="saveDoodle()" class="action-btn save-btn" title="Save Doodle">
        <span class="material-symbols-rounded">check</span>
        Save
      </button>

      <button (click)="close()" class="action-btn icon-only" title="Close">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
  </div>
</div>
